  card(false,h('div','em',pass?(lv==10?'🏆':'🌟'):'💪'),h('h2','',pass?(lv==10?'จบเกม! คุณคือปรมาจารย์ภูมิศาสตร์':'ผ่านเลเวล '+lv+'!'):'ยังไม่ผ่านเลเวล '+lv),
   h('p','','ตอบถูก '+right+'/10 (ต้องถูก 6 ข้อขึ้นไป)'+(pass?'<br>โบนัสผ่านเลเวล 🪙'+bonus:'')),
   pass&&lv<10?btn('เลเวลถัดไป ▶',()=>startLevel(lv+1)):btn('เล่นเลเวลนี้อีกครั้ง',()=>startLevel(lv)),btn('เมนูเลือกเลเวล',menu,'g'))}
function menu(){locked=true;idle=true;$('#cl').style.display=$('#bar').style.display=$('#zm').style.display='none';clearMarks();$('#rd').textContent='';$('#sc').textContent='🪙 '+coins;
  const gr=h('div','grid');for(let L=1;L<=10;L++){const lk=L>save.u,b=h('button','lv'+(lk?' lk':''),L+'<small>'+(lk?'🔒':save.s[L-1]!=null?'⭐ '+save.s[L-1]+'/10':'เล่น')+'</small>');b.onclick=()=>{if(!lk)startLevel(L)};gr.append(b)}
  card(false,h('h1','','Globe Trotter'),h('h3','','ตามหาสถานที่ปริศนา'),h('p','sm','100 คำถาม 10 เลเวล · เลเวลละ 10 ข้อ ตอบถูก 6 ข้อขึ้นไปจึงผ่าน'),gr,
   h('p','sm','แตะบนโลกเพื่อปักหมุด · ใบ้แรกฟรี ใบ้ต่อไปต้องใช้เหรียญซื้อ · มี 3 โอกาสต่อข้อ<br>ลากเพื่อหมุนโลก บีบนิ้วหรือกด +/− เพื่อซูม'))}
$('#mn').onclick=menu;
// ---- input ----
const ptr=new Map(),rc=new T.Raycaster(),v2=new T.Vector2();let moved=0,pd=0;
const pdist=()=>{const a=[...ptr.values()];return Math.hypot(a[0][0]-a[1][0],a[0][1]-a[1][1])||1},zc=z=>Math.max(.38,Math.min(1.1,z));
function tap(e){if(paused||locked)return;const r=cv.getBoundingClientRect();v2.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);rc.setFromCamera(v2,cam);
  const hit=rc.intersectObject(globe)[0];if(!hit)return;const p=G.worldToLocal(hit.point.clone()).normalize();
  guess=[0,Math.asin(p.y)/D,Math.atan2(p.x,p.z)/D];if(gm)G.remove(gm.g);gm=mark(guess[1],guess[2],'#ffffff');render()}
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);moved=0;tw=null;if(ptr.size==2)pd=pdist()};
cv.onpointermove=e=>{const o=ptr.get(e.pointerId);if(!o)return;const dx=e.clientX-o[0],dy=e.clientY-o[1];ptr.set(e.pointerId,[e.clientX,e.clientY]);moved+=Math.abs(dx)+Math.abs(dy);
  if(ptr.size==1){G.rotation.y+=dx*.006*zoom;G.rotation.x=Math.max(-1.3,Math.min(1.3,G.rotation.x+dy*.006*zoom))}else{const d=pdist();zoom=zc(zoom*pd/d);pd=d}};
cv.onpointerup=cv.onpointercancel=e=>{if(ptr.size==1&&moved<8&&e.type=='pointerup')tap(e);ptr.delete(e.pointerId)};
cv.onwheel=e=>{zoom=zc(zoom*(1+e.deltaY*.001))};$('#zi').onclick=()=>zoom=zc(zoom*.75);$('#zo').onclick=()=>zoom=zc(zoom*1.33);$('#bd').onclick=()=>{bl.visible=!bl.visible;$('#bd').style.opacity=bl.visible?1:.45};
function rs(){const w=cv.clientWidth,hh=cv.clientHeight,a=w/hh;R.setSize(w,hh,false);cam.aspect=a;cam.fov=2*Math.atan(1.12/(3.2*Math.min(1,a)))/D;cam.updateProjectionMatrix()}
new ResizeObserver(rs).observe(cv);rs();
// ---- loop ----
function frame(t){const dt=Math.min(.05,(t-last)/1000);last=t;
  if(idle&&!tw)G.rotation.y+=dt*.15;cloud.rotation.y+=dt*.01;
  if(tw){const k=Math.min(1,dt*4);G.rotation.y+=(tw.ry-G.rotation.y)*k;G.rotation.x+=(Math.max(-1.3,Math.min(1.3,tw.rx))-G.rotation.x)*k;if(Math.abs(tw.ry-G.rotation.y)<.004)tw=null}
  cam.position.z+=(3.2*zoom-cam.position.z)*Math.min(1,dt*6);
  R.render(scn,cam);requestAnimationFrame(frame)}
requestAnimationFrame(frame);menu();
</script>
